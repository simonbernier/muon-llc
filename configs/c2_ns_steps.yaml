# C2: Newton-Schulz iterations k vs target condition number kappa (no momentum, no wd).
# A5: singular values of the normalised update below ~a^-k (a = 3.4445) are not flattened,
# so uniform growth breaks down at kappa* ∝ a^k. Observables (sweep.py): lag ratio
# [t½(s_4)/t½(s_1)] / (s_4/s_1)^{1/L} (1 under uniform growth, >>1 under saddle-to-saddle, inf if
# s_4 never reaches half its target) and the uniformity ratio s_4/s_1 at t½(s_4).
# Steps must be long enough for the saddle-to-saddle runs (small k, large kappa) to finish, or
# they are classified as broken via lag = inf, which is correct but coarse.
extends: base.yaml
name: c2_ns_steps
optimizer:
  name: spectral
  lr: 0.005
  momentum: 0.0
  orth: ns
  ns_steps: 5
  weight_decay: 0.0
train:
  steps: 20000
  n_checkpoints: 12
  extra_checkpoints: []
sweep:
  grid:
    optimizer.ns_steps: [1, 2, 3, 5, 10]
    data.kappa: [2, 4, 8, 16, 32, 64, 128]   # sets singular_values = 4 * kappa^(-(i-1)/3), i = 1..4
  llc: false
  llc_checkpoints: {max: 6}

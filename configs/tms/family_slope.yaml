# Activation slope from ReLU to linear, small initial point, importances 0.5^j, 8 features in 4
# dimensions. Under SGD the features are learned one at a time at every slope.
extends: family_base.yaml
name: family_slope
r: 4
c: 8
epochs: 8000
grid:
  slope: [0.0, 0.05, 0.1, 0.25, 0.5, 0.75, 1.0]
  rho: 0.5
  init_length: 0.0
  init_noise: 0.02
  bias_std: 0.0

[project]
name = "muon-llc"
version = "0.1.0"
description = "LLC trajectories under Muon vs GD in deep linear networks (Phase C of the research plan)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]
dev = ["pytest>=8.0", "ruff>=0.5"]
mcmc = ["numpyro>=0.15", "jax>=0.4.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muon_llc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E741"]
